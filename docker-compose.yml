version: "3.8"
services:
  fleetpro-postgres:
    image: postgres:18
    container_name: fleetpro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloakpass
    volumes:
      - fleetpro_pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"

  fleetpro-keycloak:
    image: quay.io/keycloak/keycloak:26.5.1
    container_name: fleetpro-keycloak
    restart: unless-stopped
    depends_on:
      - fleetpro-postgres
    command:
      - start-dev
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://fleetpro-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloakpass
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./FleetPro-realm.json:/opt/keycloak/data/import/FleetPro-realm.json:ro
      - ./keycloak-theme-for-kc-all-other-versions.jar:/opt/keycloak/providers/keycloak-theme.jar:ro

  fleetpro-senvdb:
    image: postgres:18
    container_name: fleetpro-senvdb
    restart: unless-stopped
    environment:
      POSTGRES_DB: senvdb
      POSTGRES_USER: senvdb
      POSTGRES_PASSWORD: senvdbpass
    volumes:
      - fleetpro_senvdb_data:/var/lib/postgresql
    ports:
      - "5433:5432"

  fleetpro-questdb:
    image: questdb/questdb:latest
    container_name: fleetpro-questdb
    restart: unless-stopped
    environment:
      QDB_PG_USER: admin
      QDB_PG_PASSWORD: quest
      QDB_INSTANCE_NAME: fleetpro-questdb
    volumes:
      - fleetpro_questdb_data:/var/lib/questdb
    ports:
      - "9001:9000"
      - "8812:8812"
      - "9009:9009"

  adminapi:
    image: node:20
    container_name: fleetpro-adminapi
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./Adminapi/dist:/app
      - ./Adminapi/.env:/app/.env
    command: sh -c "npm install && node server.js"
    depends_on:
      - fleetpro-keycloak
      - fleetpro-postgres
    # no ports exposed — nginx proxies internally

  simulator-api:
    image: python:3.11
    container_name: fleetpro-simulator
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./Simulator:/app
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      - fleetpro-keycloak
      - fleetpro-postgres
    # no ports exposed — nginx proxies internally

  webapp:
    image: nginx:alpine
    container_name: fleetpro-webapp
    restart: unless-stopped
    volumes:
      - ./Webapp/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5173:80"
    depends_on:
      - adminapi
      - simulator-api

volumes:
  fleetpro_pgdata:
  fleetpro_senvdb_data:
  fleetpro_questdb_data: