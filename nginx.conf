# Main webapp — fleetpro.local
server {
    listen 80;
    server_name fleetpro.local;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Admin API — adminapi.fleetpro.local
server {
    listen 80;
    server_name adminapi.fleetpro.local;

    location / {
        proxy_pass http://adminapi:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# Simulator API — simulator.fleetpro.local
server {
    listen 80;
    server_name simulator.fleetpro.local;

    location / {
        proxy_pass http://simulator-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}